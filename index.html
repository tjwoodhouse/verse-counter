<body>
<h1>Verse Counter (BSB)</h1>
<p>This tool counts verses between references or calculates the reference based of a starting reference and how many verses to move forward based of the BSB Bible.</p>

<fieldset>
  <legend>Count Verses</legend>
  <label for="c-start">Start</label>
  <input id="c-start" placeholder="Gen 1:1">
  <label for="c-end">End</label>
  <input id="c-end" placeholder="Rev 22:21">
  <button onclick="doCount()">Count</button>
  <div class="result" id="count-out"></div>
  <div class="hint">Example: Gen 1:1 &rarr; Deut 34:12</div>
</fieldset>

<fieldset>
  <legend>Find Target Verse</legend>
  <label for="t-start">Start</label>
  <input id="t-start" placeholder="Gen 1:1">
  <label for="t-n">Count forward (verses)</label>
  <input id="t-n" type="number" placeholder="100" min="1">
  <button onclick="doFindTarget()">Find</button>
  <div class="result" id="target-out"></div>
  <div class="hint">Returns the reference of the Nth verse from start.</div>
</fieldset>

function findBook(s) {
  s = s.toLowerCase().replace(/\s+/g, '');
  for (let i = 0; i < BOOKS.length; i++) {
    if (BOOKS[i][1].includes(s)) return i;
    if (s === BOOKS[i][0].toLowerCase().replace(/\s+/g, '')) return i;
  }
  return -1;
}

function parseRef(s) {
  s = s.trim();
  const m = s.match(/^(\d?\s*[a-zA-Z]+(?:\s+[a-zA-Z]+)?)\s+(\d+):(\d+)$/);
  if (!m) return null;
  const bookIdx = findBook(m[1]);
  if (bookIdx < 0) return null;
  const chapter = parseInt(m[2]);
  const verse = parseInt(m[3]);
  const chapters = BOOKS[bookIdx][2];
  if (chapter < 1 || chapter > chapters.length) return null;
  if (verse < 1 || verse > chapters[chapter - 1]) return null;
  return { bookIdx, chapter, verse };
}

function refToIdx(ref) {
  let idx = 0;
  for (let b = 0; b < ref.bookIdx; b++)
    for (const v of BOOKS[b][2]) idx += v;
  for (let c = 0; c < ref.chapter - 1; c++)
    idx += BOOKS[ref.bookIdx][2][c];
  return idx + ref.verse;
}

function idxToRef(idx) {
  let rem = idx;
  for (let b = 0; b < BOOKS.length; b++) {
    for (let c = 0; c < BOOKS[b][2].length; c++) {
      const cv = BOOKS[b][2][c];
      if (rem <= cv) return `${BOOKS[b][0]} ${c + 1}:${rem}`;
      rem -= cv;
    }
  }
  return null;
}

function doCount() {
  const out = document.getElementById('count-out');
  const s = parseRef(document.getElementById('c-start').value);
  const e = parseRef(document.getElementById('c-end').value);
  if (!s) { out.innerHTML = '<span class="error">Invalid start reference</span>'; return; }
  if (!e) { out.innerHTML = '<span class="error">Invalid end reference</span>'; return; }
  const si = refToIdx(s), ei = refToIdx(e);
  if (si > ei) { out.innerHTML = '<span class="error">Start must be before end</span>'; return; }
  out.textContent = `${ei - si + 1} verses`;
}

function doFindTarget() {
  const out = document.getElementById('target-out');
  const s = parseRef(document.getElementById('t-start').value);
  const n = parseInt(document.getElementById('t-n').value);
  if (!s) { out.innerHTML = '<span class="error">Invalid start reference</span>'; return; }
  if (!n || n < 1) { out.innerHTML = '<span class="error">Enter a positive number</span>'; return; }
  const totalVerses = BOOKS.reduce((sum, b) => sum + b[2].reduce((a, v) => a + v, 0), 0);
  const si = refToIdx(s);
  const ti = Math.min(si + n - 1, totalVerses);
  const ref = idxToRef(ti);
  out.textContent = ref || 'Beyond end of Bible';
}
